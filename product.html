<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>JAVELINAUTS Uniforms</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>


<body class="product-page">
  


  <!-- =========================
       商品写真
  ========================== -->

  <section class="product-gallery">

    <!-- 一覧へ戻る -->
    <a
      href="uniforms.html"
      class="product-close"
      aria-label="ユニ一覧に戻る"
    >
      ×
    </a>


    <!-- 写真 -->
    <div class="gallery-viewport">

      <div class="gallery-track" id="gallery-track">
</div>


      <!-- 左矢印 -->
      <button
        class="gallery-arrow gallery-prev"
        type="button"
        aria-label="前の写真"
      >
        ‹
      </button>


      <!-- 右矢印 -->
      <button
        class="gallery-arrow gallery-next"
        type="button"
        aria-label="次の写真"
      >
        ›
      </button>

    </div>


    <!-- 丸ポチ -->
    <div class="gallery-dots"></div>

  </section>



  <!-- =========================
       商品情報
  ========================== -->

  <main class="product-content">

    <section class="product-heading">

      <h1 id="product-name"></h1>
      <p
  class="product-required"
  id="product-required"
>
  購入必須
</p>

      <p
  class="product-price"
  id="product-price"
></p>

      <p class="price-note">
        ※2026年9月参照。<br>
        値段は時期や発注数によって前後します。<br>
        写真はイメージです。
      </p>

    </section>


    <!-- アコーディオンは次の工程 -->

    <!-- =========================
     ACCORDION
========================== -->

<section class="product-accordions">


  <!-- アイテム説明 -->

  <div class="accordion-item">

    <button
      class="accordion-header"
      type="button"
      aria-expanded="false"
      data-voice="description"
    >
      <span>アイテム説明</span>
      <span class="accordion-icon"></span>
    </button>

    <div class="accordion-content">

      <div class="accordion-inner">

        <div class="description-block">

          <h3>デザイン</h3>

          <p id="product-design"></p>

        </div>


        <div class="description-block">

          <h3>素材</h3>

          <p id="product-material"></p>

        </div>

      </div>

    </div>

  </div>


  <!-- アイテムサイズ -->

  <div class="accordion-item">

    <button
      class="accordion-header"
      type="button"
      aria-expanded="false"
      data-voice="size"
    >
      <span>アイテムサイズ</span>
      <span class="accordion-icon"></span>
    </button>

    <div class="accordion-content">

  <div class="accordion-inner">

    <div id="product-size-container"></div>

  </div>

</div>

  </div>


  <!-- レビュー -->

  <div class="accordion-item">

    <button
      class="accordion-header"
      type="button"
      aria-expanded="false"
      data-voice="review"
    >
      <span>レビュー</span>
      <span class="accordion-icon"></span>
    </button>

    <div class="accordion-content">

      <div class="accordion-inner review-content">

  <div id="review-container"></div>

</div>

  </div>
</div>


</section>


    <!-- フッター -->

    <footer class="site-footer">

  <img
    src="images/jave-logo-transparent.png"
    alt=""
    class="footer-team-logo"
    aria-hidden="true"
  >

  <div class="footer-content">

    <h2>JAVELINAUTS</h2>

    <p>Win by all nauts</p>

    <p>Since 2013</p>

    <a href="index.html" class="footer-top-link">
  <span>TOP</span>
  <span class="footer-top-arrow">→</span>
</a>

  </div>

</footer>

  </main>


  <script src="js/products.js"></script>
<script src="js/main.js"></script>
</body>

</html>
