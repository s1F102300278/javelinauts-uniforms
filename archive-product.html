<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

  <title>JAVELINAUTS Archive</title>

  <link rel="stylesheet" href="css/style.css?v=1">
</head>


<body class="product-page archive-product-page">


  <main class="product-container">


    <!-- ========================================
         PRODUCT GALLERY
    ======================================== -->

    <section class="product-gallery">

      <a
        href="uniforms.html"
        class="product-close"
        aria-label="ユニフォーム一覧へ戻る"
      >
        <span class="product-back-arrow">←</span>
        <span>BACK</span>
      </a>


      <div class="gallery-viewport">

        <div
          class="gallery-track"
          id="archive-gallery-track"
        ></div>

      </div>


      <button
        type="button"
        class="gallery-arrow gallery-prev"
        aria-label="前の画像"
      >
        ‹
      </button>

      <button
        type="button"
        class="gallery-arrow gallery-next"
        aria-label="次の画像"
      >
        ›
      </button>


      <div
        class="gallery-dots"
        id="archive-gallery-dots"
      ></div>


      <div class="gallery-counter">
        <span id="gallery-current">1</span>

        <span class="gallery-counter-separator">/</span>

        <span id="gallery-total">1</span>
      </div>

    </section>



    <!-- ========================================
         ARCHIVE PRODUCT INFORMATION
    ======================================== -->

    <section class="archive-product-info">

      <h1 id="archive-product-name"></h1>

      <p class="archive-not-for-sale">
        非売品
      </p>


      <div class="archive-description">

        <div class="archive-description-heading">
          <span>ITEM DESCRIPTION</span>
        </div>

        <div class="archive-description-line"></div>


        <p id="archive-product-description"></p>

      </div>

    </section>


  </main>



  <!-- ========================================
       FOOTER
  ======================================== -->

  <footer class="site-footer">

    <img
      src="images/jave-logo-transparent.png"
      alt=""
      class="footer-team-logo"
      aria-hidden="true"
    >

    <div class="footer-content">

      <h2>JAVELINAUTS</h2>

      <p>Win by all nauts</p>

      <p>Since 2013</p>


      <a href="index.html" class="footer-top-link">
        <span>TOP</span>
        <span class="footer-top-arrow">→</span>
      </a>


      <p class="footer-copyright">
        © javelinauts
      </p>

    </div>

  </footer>


  <script src="js/archive-products.js?v=1"></script>
<script src="js/archive.js?v=1"></script>

</body>

</html>
